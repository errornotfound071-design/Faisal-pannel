<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#242424">
  <title>Faisal Pannel — Firebase Login</title>
  <style>
    * { box-sizing: border-box; }
    body {
      min-height: 100vh; margin: 0; padding: 20px; display: grid; place-items: center;
      background: #181818; color: #f2f2f2;
      font-family: Arial, Helvetica, sans-serif;
    }
    .panel {
      width: min(100%, 430px); padding: 28px;
      background: #252525; border: 1px solid #454545;
      border-radius: 16px; box-shadow: 0 18px 50px #0007;
    }
    .brand { display: flex; align-items: center; gap: 12px; margin-bottom: 24px; }
    .mark {
      width: 44px; height: 44px; display: grid; place-items: center;
      border: 1px solid #777; border-radius: 12px; background: #333;
      font-size: 19px; font-weight: 800;
    }
    h1 { margin: 0; font-size: 23px; }
    .sub { margin: 5px 0 0; color: #aaa; font-size: 12px; }
    .note {
      margin: 0 0 20px; padding: 12px; border-radius: 9px;
      background: #1c1c1c; border: 1px solid #3e3e3e;
      color: #bdbdbd; font-size: 12px; line-height: 1.5;
    }
    label { display: block; margin: 15px 0 7px; color: #d0d0d0; font-size: 12px; font-weight: 700; }
    input {
      width: 100%; height: 46px; padding: 0 13px; border-radius: 9px;
      border: 1px solid #555; background: #171717; color: #fff; font-size: 15px;
      outline: none;
    }
    input:focus { border-color: #bbb; }
    button {
      width: 100%; min-height: 46px; margin-top: 14px; border: 0; border-radius: 9px;
      background: #dedede; color: #171717; font-size: 14px; font-weight: 700;
      cursor: pointer;
    }
    button:disabled { opacity: .55; cursor: wait; }
    .secondary { background: #3b3b3b; color: #eee; border: 1px solid #555; }
    #recaptcha-container { margin-top: 12px; }
    #status {
      min-height: 44px; margin-top: 16px; padding: 12px; border-radius: 9px;
      background: #1b1b1b; border: 1px solid #3e3e3e; color: #c8c8c8;
      font-size: 12px; line-height: 1.5; overflow-wrap: anywhere;
    }
    .foot { margin-top: 22px; color: #888; font-size: 10px; text-align: center; letter-spacing: 1px; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <main class="panel">
    <header class="brand">
      <div class="mark">F</div>
      <div>
        <h1>Faisal Pannel</h1>
        <p class="sub">Firebase phone sign-in</p>
      </div>
    </header>

    <p class="note">
      Secure sign-in for your own users. Firebase verifies the SMS code directly.
      This page does not collect, display to an admin, or save OTP codes or private SMS messages.
    </p>

    <section id="phone-section">
      <label for="phone">Your phone number (with country code)</label>
      <input id="phone" type="tel" autocomplete="tel" placeholder="+91XXXXXXXXXX">
      <div id="recaptcha-container"></div>
      <button id="send-code" type="button">Send verification code</button>
    </section>

    <section id="code-section" hidden>
      <label for="code">Verification code sent to your phone</label>
      <input id="code" type="text" inputmode="numeric" autocomplete="one-time-code"
             maxlength="6" placeholder="Enter the code">
      <button id="verify-code" type="button">Verify and sign in</button>
      <button id="back" class="secondary" type="button">Use another number</button>
    </section>

    <div id="status" role="status" aria-live="polite">Add your Firebase web app configuration to get started.</div>
    <button id="sign-out" class="secondary" type="button" hidden>Sign out</button>
    <footer class="foot">FAISAL PANNEL</footer>
  </main>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";
    import {
      getAuth, RecaptchaVerifier, signInWithPhoneNumber, onAuthStateChanged, signOut
    } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";

    // Replace these placeholder values with your Firebase project's Web App config.
    const firebaseConfig = {
      apiKey: "YOUR_FIREBASE_API_KEY",
      authDomain: "YOUR_PROJECT_ID.firebaseapp.com",
      projectId: "YOUR_PROJECT_ID",
      appId: "YOUR_FIREBASE_APP_ID"
    };

    const statusBox = document.getElementById("status");
    const phoneSection = document.getElementById("phone-section");
    const codeSection = document.getElementById("code-section");
    const phoneInput = document.getElementById("phone");
    const codeInput = document.getElementById("code");
    const sendButton = document.getElementById("send-code");
    const verifyButton = document.getElementById("verify-code");
    const backButton = document.getElementById("back");
    const signOutButton = document.getElementById("sign-out");

    let confirmationResult = null;
    let recaptchaVerifier = null;
    let auth = null;

    const configReady = Object.values(firebaseConfig).every(
      value => value && !value.startsWith("YOUR_")
    );

    if (!configReady) {
      statusBox.textContent =
        "Setup needed: paste your Firebase Web App config into firebaseConfig in this file.";
      sendButton.disabled = true;
    } else {
      try {
        const app = initializeApp(firebaseConfig);
        auth = getAuth(app);

        recaptchaVerifier = new RecaptchaVerifier(auth, "recaptcha-container", {
          size: "normal"
        });
        await recaptchaVerifier.render();

        onAuthStateChanged(auth, user => {
          if (user) {
            const safePhone = user.phoneNumber
              ? user.phoneNumber.replace(/^(\+\d{1,3})\d+(\d{2})$/, "$1••••••$2")
              : "verified account";
            statusBox.textContent = `Signed in successfully: ${safePhone}`;
            phoneSection.hidden = true;
            codeSection.hidden = true;
            signOutButton.hidden = false;
          } else {
            signOutButton.hidden = true;
          }
        });
        statusBox.textContent = "Firebase is ready. Enter your own phone number to sign in.";
      } catch (error) {
        statusBox.textContent = `Firebase setup error: ${error.message}`;
      }
    }

    sendButton.addEventListener("click", async () => {
      const phone = phoneInput.value.trim();
      if (!auth || !recaptchaVerifier) return;
      if (!/^\+[1-9]\d{7,14}$/.test(phone)) {
        statusBox.textContent = "Enter a valid number with country code, for example +91XXXXXXXXXX.";
        return;
      }
      sendButton.disabled = true;
      statusBox.textContent = "Requesting verification from Firebase…";
      try {
        confirmationResult = await signInWithPhoneNumber(auth, phone, recaptchaVerifier);
        phoneSection.hidden = true;
        codeSection.hidden = false;
        statusBox.textContent = "Firebase sent a verification code to your number. Enter it here to verify your sign-in.";
      } catch (error) {
        statusBox.textContent = `Could not send code: ${error.message}`;
        try { await recaptchaVerifier.clear(); } catch {}
        recaptchaVerifier = new RecaptchaVerifier(auth, "recaptcha-container", { size: "normal" });
        await recaptchaVerifier.render();
      } finally {
        sendButton.disabled = false;
      }
    });

    verifyButton.addEventListener("click", async () => {
      const code = codeInput.value.trim();
      if (!confirmationResult) return;
      if (!/^\d{6}$/.test(code)) {
        statusBox.textContent = "Enter the 6-digit verification code.";
        return;
      }
      verifyButton.disabled = true;
      statusBox.textContent = "Verifying securely with Firebase…";
      try {
        await confirmationResult.confirm(code);
        codeInput.value = "";
        statusBox.textContent = "Phone number verified.";
      } catch (error) {
        statusBox.textContent = `Verification failed: ${error.message}`;
      } finally {
        verifyButton.disabled = false;
      }
    });

    backButton.addEventListener("click", () => {
      confirmationResult = null;
      codeInput.value = "";
      codeSection.hidden = true;
      phoneSection.hidden = false;
      statusBox.textContent = "Enter your phone number to request a new verification code.";
    });

    signOutButton.addEventListener("click", async () => {
      try {
        await signOut(auth);
        phoneInput.value = "";
        codeInput.value = "";
        confirmationResult = null;
        phoneSection.hidden = false;
        codeSection.hidden = true;
        statusBox.textContent = "Signed out.";
      } catch (error) {
        statusBox.textContent = `Sign-out failed: ${error.message}`;
      }
    });
  </script>
</body>
</html>
